name: Phase 0 iPhone device specifications

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/runtime/device-catalog.json'
      - 'templates/runtime/probe-device.mjs'
      - 'templates/runtime/probe-screen.swift'
      - 'templates/runtime/simulator-utils.mjs'
      - 'scripts/phase0-device-specs.mjs'
      - '.github/workflows/device-specs.yml'

permissions:
  contents: read

jobs:
  verify-simulator-screens:
    name: Verify screen pixels and runtime safe areas
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Record the Xcode and simulator inventory
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list devicetypes
          swiftc -help | grep -F -- '-parse-as-library'

      - name: Install IDB for point-space coordinate verification
        run: |
          brew tap facebook/fb
          brew trust --formula facebook/fb/idb-cli
          brew trust --formula facebook/fb/idb-companion
          brew install facebook/fb/idb-cli facebook/fb/idb-companion
          idb --help >/dev/null

      - name: Probe every catalog device and fail on confirmed-spec mismatches
        run: node scripts/phase0-device-specs.mjs

      - name: Upload Phase 0 device screenshots and runtime profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ios-device-specs
          path: evidence/device-specs/
          if-no-files-found: warn
          retention-days: 30
