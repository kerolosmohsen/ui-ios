name: Extract official Apple device bezels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Extract PNG bezels from Apple Design Resources
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download and extract official PNG bezel assets
        run: bash scripts/extract-apple-bezels.sh

      - name: Upload extracted bezel PNGs
        uses: actions/upload-artifact@v7
        with:
          name: official-apple-device-bezels
          path: ${{ runner.temp }}/ui-ios-apple-bezels/
          if-no-files-found: error
          retention-days: 7
